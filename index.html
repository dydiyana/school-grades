<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كشوف الدرجات — Bulletins scolaires</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17694d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style id="page-style"></style>
<style>
:root{
  --bg:#f5f4ef; --surface:#ffffff; --surface-2:#f0eee7; --surface-3:#e8e5dc;
  --ink:#1c2420; --ink-2:#56615c; --ink-3:#88928d;
  --line:#e0ddd4; --line-strong:#cbc7bb;
  --accent:#17694d; --accent-hover:#115840; --accent-ink:#ffffff; --accent-soft:#e1efe8;
  --gold:#c99a1e; --gold-soft:#faf0d3;
  --warn:#8f5400; --warn-soft:#fdf0d8; --bad:#b3261e; --bad-soft:#fde4e1;
  --radius:10px; --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.05);
  --font-ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --font-doc:"Noto Naskh Arabic","Traditional Arabic","Simplified Arabic","Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --surface:#1a1f1d; --surface-2:#212826; --surface-3:#2a322f;
    --ink:#e7ece9; --ink-2:#a5b0aa; --ink-3:#77827d;
    --line:#2f3834; --line-strong:#414b47;
    --accent:#5cc49a; --accent-hover:#79d3ae; --accent-ink:#0c1a13; --accent-soft:#1d362b;
    --gold:#e3b84a; --gold-soft:#3a3018;
    --warn:#f0b35a; --warn-soft:#382b17; --bad:#ff8f86; --bad-soft:#3d1f1c;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a1f1d; --surface-2:#212826; --surface-3:#2a322f;
  --ink:#e7ece9; --ink-2:#a5b0aa; --ink-3:#77827d;
  --line:#2f3834; --line-strong:#414b47;
  --accent:#5cc49a; --accent-hover:#79d3ae; --accent-ink:#0c1a13; --accent-soft:#1d362b;
  --gold:#e3b84a; --gold-soft:#3a3018;
  --warn:#f0b35a; --warn-soft:#382b17; --bad:#ff8f86; --bad-soft:#3d1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
@media screen{body{zoom:var(--zoom,1)}}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:0 16px}

/* top bar */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.topbar .wrap{display:flex;align-items:center;gap:10px 14px;padding-top:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1 1 auto}
.brand svg{flex:none}
.brand-title{font-weight:700;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-sub{color:var(--ink-2);font-size:12.5px}
.class-pick{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.class-pick select{font-weight:700;color:var(--accent);min-width:96px}
.sync{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px 5px 10px;font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;cursor:default}
.sync::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.sync.wait::before{background:var(--gold)}
.sync.off::before{background:var(--ink-3)}
.sync.err{color:var(--bad)}
.sync.err::before{background:var(--bad)}
.sync.act{cursor:pointer;border-color:var(--line-strong);color:var(--ink)}
.sync.act:hover{background:var(--surface-3)}
.sync.signin{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;padding:6px 14px}
.sync.signin::before{display:none}
.sync.signin:hover{background:var(--accent-hover)}
.g-logo{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#fff;color:#4285f4;font:700 12px/1 Arial,sans-serif;flex:none}
.welcome-list{margin:4px 0 10px;padding-inline-start:20px;font-size:13px;color:var(--ink-2)}
.welcome-list li{margin:3px 0}
/* accounts */
.acct-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:3px 12px 3px 4px;min-height:36px;cursor:pointer;max-width:260px;font-size:13px;color:var(--ink)}
.acct-chip:hover{background:var(--surface-2)}
.acct-chip .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px}
.av.dev{background:var(--surface-3);color:var(--ink-2)}
.av.add{background:#fff;color:#4285f4;border:1px solid var(--line-strong);font-family:Arial,sans-serif}
.acct-list{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.acct-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:8px 12px;cursor:pointer;min-height:50px;color:var(--ink)}
.acct-opt:hover{background:var(--surface-2);border-color:var(--accent)}
.acct-opt.cur{border-color:var(--accent);background:var(--accent-soft)}
.acct-opt.add{border-style:dashed}
.acct-opt .av,.acct-row .av{width:36px;height:36px;font-size:16px}
.acct-opt .t,.acct-row .t{display:flex;flex-direction:column;min-width:0;flex:1}
.acct-opt .t b,.acct-row .t b{font-size:14px}
.acct-opt .t small,.acct-row .t small{color:var(--ink-2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-opt em,.acct-row em{font-style:normal;font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap}
.acct-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.acct-row:last-child{border-bottom:0}
.acct-row .btn{min-height:34px;padding:4px 12px}
/* languages */
.lang-btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 12px;min-height:34px;cursor:pointer;font-size:13px;color:var(--ink)}
.lang-btn:hover{background:var(--surface-2)}
[dir=ltr] .grid .c-num{right:auto;left:0}
[dir=ltr] .grid .c-name{right:auto;left:40px;text-align:left}
[dir=ltr] table.mini th,[dir=ltr] .acct-opt,[dir=ltr] .acct-row{text-align:left}
[dir=ltr] .pp-sub,[dir=ltr] .pp-name{text-align:left}
.card{direction:rtl}
/* licence */
.locked .class-pick,.locked .acct-chip,.locked .sync,.locked .tabs{display:none!important}
.lic{display:flex;justify-content:center;padding:20px 0 30px}
.lic-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px 24px;width:min(580px,100%)}
.lic-card h2{margin:0;font-size:19px}
.lic-card p.fr{margin:2px 0 12px;color:var(--ink-2);font-family:"Segoe UI",Arial,sans-serif}
.lic-lbl{display:block;margin:10px 0;font-size:13px;color:var(--ink-2)}
.lic-lbl .fr{font-family:"Segoe UI",Arial,sans-serif;color:var(--ink-3)}
.lic-lbl input,.lic-lbl textarea{display:block;width:100%;margin-top:4px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 9px;min-height:36px;font-family:inherit}
.lic-lbl textarea{font-family:Consolas,monospace;font-size:12px}
.lic-lbl input[readonly]{background:var(--surface-2);font-weight:600}
.lic-lbl input.otp{font-family:Consolas,monospace;font-size:24px;letter-spacing:10px;text-align:center;max-width:260px;margin-inline:auto}
.lic-vendor{font-size:13px;color:var(--ink-2)}
.lic-banner{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px;font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:7px 12px 8px;font-size:13.5px;color:var(--ink-2);background:none;border:0;font-weight:500;border-bottom:2.5px solid transparent;white-space:nowrap;border-radius:6px 6px 0 0;cursor:pointer}
.tabs button:hover{color:var(--ink);background:var(--surface-2)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

main{padding-top:18px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
h2.view-title{font-size:17px;margin:0 0 4px}
.view-sub{color:var(--ink-2);margin:0 0 12px;font-size:12.5px}

/* controls */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.toolbar .grow{flex:1}
input[type=search],select,.fld input,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:5px 9px;min-height:34px}
input[type=search]{min-width:220px}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fld{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;padding:5px 12px;min-height:34px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--line-strong)}
.btn.danger:hover{background:var(--bad-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{background:none;border:1px solid transparent;border-radius:6px;width:32px;height:32px;color:var(--ink-3);cursor:pointer;font-size:18px;line-height:1}
.icon-btn:hover{color:var(--bad);background:var(--bad-soft)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 11px;min-height:32px;cursor:pointer;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:7px 12px}
.tile .k{color:var(--ink-2);font-size:11.5px}
.tile .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.tile .s{color:var(--ink-3);font-size:11px}

/* alerts */
details.alerts{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px}
details.alerts summary{cursor:pointer;font-weight:600;color:var(--warn)}
details.alerts ul{margin:8px 0 2px;padding-inline-start:20px}
details.alerts li{margin:2px 0;font-size:12.5px}

/* grids */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 250px);min-height:240px;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}
.grid thead{position:sticky;top:0;z-index:3}
.grid th,.grid td{border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);padding:0 6px;height:30px;font-size:13px;text-align:center;white-space:nowrap;background:var(--surface)}
.grid th:first-child,.grid td:first-child{border-inline-start:0}
.grid thead th{background:var(--surface-2);font-weight:600;font-size:12px;color:var(--ink-2);height:auto;padding:5px 6px;line-height:1.3}
.grid thead th small{display:block;font-weight:500;color:var(--ink-3);font-size:10.5px}
.grid thead th.subj{min-width:62px;max-width:110px;white-space:normal}
.grid .c-num{position:sticky;right:0;z-index:1;width:40px;min-width:40px;color:var(--ink-2)}
.grid .c-name{position:sticky;right:40px;z-index:1;text-align:right;min-width:170px;border-inline-end:1px solid var(--line-strong)}
.grid thead .c-num,.grid thead .c-name{z-index:4}
.grid tbody tr:hover td{background:var(--surface-2)}
.grid .gen{background:var(--accent-soft)}
.grid thead th.gen{background:color-mix(in srgb,var(--accent-soft) 80%,var(--surface-2));color:var(--accent)}
.grid td.avg{font-weight:600}
.muted{color:var(--ink-3)}
.pname{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 6px;min-height:26px;font-size:13px}
.pname:hover{border-color:var(--line-strong)}
.pname:focus{border-color:var(--accent);background:var(--surface);outline:none}
.pname::placeholder{color:var(--bad);opacity:.8}
.nm{display:block;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.nm.empty{color:var(--bad)}
.mk{width:46px;height:26px;font-size:13px;text-align:center;border:1px solid transparent;background:transparent;border-radius:6px;font-variant-numeric:tabular-nums}
.mk:hover{border-color:var(--line-strong)}
.mk:focus{border-color:var(--accent);background:var(--surface);outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.mk.gap{background:var(--warn-soft)}
.mk.over,.mk.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);font-weight:600}
.rk{display:inline-block;min-width:26px;padding:0 7px;border-radius:999px;font-weight:600}
.rk.top{background:var(--gold-soft);color:var(--ink)}
.rk.top1{background:var(--gold);color:#1c1608}
.hint{color:var(--ink-2);font-size:13px;margin:0 0 12px}
.print-head{display:none}
.empty-state{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:30px 20px;text-align:center;color:var(--ink-2)}
.empty-state .btn{margin-top:12px}

/* pupil-by-pupil entry (phone) */
.pp{max-width:560px;margin:0 auto}
.pp-nav{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin-bottom:12px}
.pp-nav select{width:100%;min-width:0}
.pp-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.pp-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pp-name{font-weight:700;font-size:15px}
.pp-num{color:var(--ink-2);font-size:13px;white-space:nowrap}
.pp-row{display:grid;grid-template-columns:1fr auto 76px;align-items:center;gap:10px;padding:5px 14px;border-bottom:1px solid var(--line)}
.pp-row:last-child{border-bottom:0}
.pp-sub{font-weight:500}
.pp-max{color:var(--ink-3);font-size:13px}
.pp-row .mk{width:70px;height:38px;font-size:16px;border-color:var(--line-strong);background:var(--surface)}
.pp-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}

/* report cards */
.sheets{display:flex;flex-direction:column;gap:22px;align-items:center}
.sheet{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;width:100%}
.card{background:#fff;color:#111;width:min(100%,560px);border:1px solid #9a9a9a;box-shadow:var(--shadow);padding:18px 22px 16px;font-family:var(--font-doc);font-size:13.5px;line-height:1.5;color-scheme:light}
.card .rep{text-align:center;font-weight:700;font-size:1.12em}
.card .motto{text-align:center;font-size:.9em;margin-top:-2px}
.card .admin{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:.86em;line-height:1.6}
.card .admin .l{text-align:left;white-space:nowrap}
.card .ttl{text-align:center;margin:10px 0 2px;font-weight:700;font-size:1.3em}
.card .exam{text-align:center;font-weight:600;margin-bottom:8px}
.card .who{display:flex;justify-content:space-between;gap:10px;border:1px solid #111;padding:4px 10px;margin-bottom:8px}
.card .who b{font-size:1.05em}
.card table{width:100%;border-collapse:collapse;font-size:.95em}
.card th,.card td{border:1px solid #111;padding:2px 8px;height:1.9em}
.card thead th{background:#ececec;text-align:center;font-weight:700}
.card tbody th{text-align:right;font-weight:600}
.card td.g{text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;width:30%}
.card td.g b{font-size:1.06em}
.card td.notes{text-align:center;vertical-align:top;width:27%;padding-top:10px}
.card .rk-lbl{font-weight:600}
.card .rk-val{font-size:2.1em;font-weight:700;line-height:1.2;margin-top:4px}
.card .rk-of{font-size:.85em}
.card tr.sum th{background:#f6f6f6}
.card tr.final th,.card tr.final td.g{background:#e9e9e9;font-weight:700}
.card .sig{display:flex;justify-content:space-between;margin-top:12px;font-weight:600;padding:0 12px;min-height:58px}
.card .fr{font-family:"Segoe UI",Arial,sans-serif}
.card.sec{width:min(100%,860px)}
.card .sec-head{display:flex;justify-content:space-between;gap:16px;font-size:.84em;line-height:1.55}
.card .sec-head .ar{font-weight:600}
.card .sec-head .fr{text-align:left}
.card .who.sec{flex-wrap:wrap;gap:2px 18px}
.card .who i,.card .sig i{font-style:normal;font-size:.78em;font-weight:400;color:#444;font-family:"Segoe UI",Arial,sans-serif}
.card table.sec{font-size:.86em}
.card table.sec td{text-align:center;font-variant-numeric:tabular-nums}
.card table.sec td.b{font-weight:700}
.card table.sec thead th{line-height:1.25;padding:3px 4px;font-size:.92em}
.card table.sec .fr{display:block;font-weight:400;font-size:.8em;color:#333}
.card table.sec .fr.in{display:inline;margin-inline-start:6px}
.grid th.tiny{font-size:10.5px;font-weight:500;padding:3px 4px}
.grid.sec .mk{width:40px}
.c-sa{color:var(--ink-2);font-size:12px;font-variant-numeric:tabular-nums}
.pp-row.sec{grid-template-columns:1fr 66px 66px 50px}
.pp-in{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink-3)}
.pp-row.sec .mk{width:62px;height:34px;font-size:15px;border-color:var(--line-strong);background:var(--surface)}
.pp-sub small{display:block;color:var(--ink-3);font-size:11px;font-weight:400}

/* settings */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.panel h3{margin:0 0 4px;font-size:15px}
.panel p.d{margin:0 0 10px;color:var(--ink-2);font-size:12.5px}
.form{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center}
.form label{color:var(--ink-2);font-size:13px}
.form input{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:5px 9px;min-height:34px;width:100%;min-width:0}
table.mini{width:100%;border-collapse:collapse}
table.mini th{font-size:12.5px;color:var(--ink-2);font-weight:600;text-align:right;padding:4px 5px}
table.mini td{padding:4px 5px}
table.mini input{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:4px 8px;min-height:32px;width:100%;min-width:0}
table.mini input[type=number]{width:76px;text-align:center}
.row-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.total-line{margin-top:8px;color:var(--ink-2);font-size:13.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-bottom:6px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}

/* dialog */
dialog#dlg{border:0;border-radius:14px;padding:0;width:min(520px,calc(100% - 32px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog#dlg::backdrop{background:rgba(10,15,12,.45)}
.dlg-form{padding:18px 20px 16px}
.dlg-form h3{margin:0 0 10px;font-size:17px}
.dlg-body p{margin:0 0 10px}
.dlg-body label{display:block;margin-bottom:10px;font-size:13px;color:var(--ink-2)}
.dlg-body label input,.dlg-body label select,.dlg-body label textarea{display:block;width:100%;margin-top:4px;color:var(--ink)}
.dlg-body label.chk{display:flex;align-items:center;gap:8px;color:var(--ink)}
.dlg-body label.chk input{display:inline-block;width:auto;margin:0;flex:none}
.dlg-body textarea{min-height:140px;resize:vertical}
.dlg-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.choice{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}

/* toast */
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:700px){
  body{font-size:14px}
  .topbar{position:static}
  .brand-title{font-size:14px}
  .brand-sub{display:none}
  .sync{order:5;flex:1 1 100%;justify-content:flex-start}
  .acct-chip{max-width:100%;flex:1 1 auto}
  input[type=search]{min-width:0;flex:1 1 100%}
  .table-wrap{max-height:68vh}
  .grid .c-name{min-width:130px}
  .nm{max-width:140px}
  .form{grid-template-columns:1fr;gap:4px}
  .form label{margin-top:6px}
  .card{padding:14px 12px;font-size:13px}
  .card .admin{flex-direction:column}
  .card .admin .l{text-align:right}
  .card .sec-head{flex-direction:column}
  .card .sec-head .fr{text-align:right}
  .toolbar .fld{flex:1 1 100%;justify-content:space-between}
  .toolbar .fld select{flex:1}
}

@media print{
  :root{color-scheme:light}
  body{background:#fff;color:#000;font-size:10pt}
  .no-print,.topbar,.toast,dialog{display:none!important}
  .wrap{max-width:none;padding:0}
  main{padding:0}
  .print-head{display:block;text-align:center;margin-bottom:4mm;font-family:var(--font-doc)}
  .print-head .p1{font-weight:700;font-size:13pt}
  .print-head .p2{font-size:10pt}
  .table-wrap{overflow:visible;max-height:none;border:0;box-shadow:none;border-radius:0;min-height:0}
  table.grid{width:100%;min-width:0}
  .grid thead{position:static}
  .grid th,.grid td{position:static!important;background:#fff!important;color:#000!important;border:0.3mm solid #444!important;height:auto;padding:1mm 1.5mm;font-size:9pt}
  .grid thead th{background:#eee!important}
  .grid thead th small{color:#333}
  .mk,.pname{border:0!important;background:none!important;color:#000!important;width:auto;height:auto;padding:0;font-weight:normal;outline:0}
  .mk{width:10mm}
  .rk{background:none!important;padding:0;min-width:0}
  .stats{grid-template-columns:repeat(6,1fr);gap:2mm;margin-bottom:3mm}
  .tile{border:0.3mm solid #999;padding:1.5mm 2mm;border-radius:0}
  .tile .v{font-size:12pt}
  details.alerts{display:none}
  .sheets{display:block}
  .sheet{flex-wrap:nowrap;gap:9mm;justify-content:center;break-after:page;page-break-after:always;width:auto}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  .card{box-shadow:none;border:0.4mm solid #000}
  .card .admin{flex-direction:row}
  .card .admin .l{text-align:left}
  .per-2 .card{width:136mm;min-height:186mm;padding:5mm 6mm 4mm;font-size:calc(9pt * var(--k,1))}
  .per-2 .card th,.per-2 .card td{height:1.8em}
  .per-1 .card{width:190mm;min-height:270mm;padding:12mm 12mm 10mm;font-size:calc(12.5pt * var(--k,1))}
  .per-1 .card .sig{min-height:30mm}
  .per-1 .card.sec{font-size:calc(11pt * var(--k,1));width:194mm;padding:8mm 8mm 6mm}
  .card .sec-head,.card .who.sec{flex-direction:row}
}
</style>

/* ================= calculation (same rules as the Excel workbook) ================= */
// exam total = sum of entered marks; exam average = total x scale / sum of max marks;
// general average = (sum of weight x exam total) / sum of weights, scaled the same way,
// only when every exam has marks; ranks = Excel RANK (descending, ties share a rank).
function rankOf(pairs) {
  const out = new Map();
  for (const [id, v] of pairs) { let r = 1; for (const [, w] of pairs) if (w > v + 1e-9) r++; out.set(id, r); }
  return out;
}
function summarize(arr) {
  if (!arr.length) return { n: 0 };
  return { n: arr.length, mean: arr.reduce((a, b) => a + b, 0) / arr.length, max: Math.max(...arr), min: Math.min(...arr), pass: arr.filter(v => v >= (+S.passMark) - 1e-9).length };
}
/* ---- secondary classes (2AS model): per subject a tests mark + an exam mark, both /20 ----
   subject average = (exam x 2 + tests) / 3 (a missing mark counts 0, as in the workbook);
   exam average   = sum(coef x subject average) / sum(coef);
   annual average = per subject (sum over exams of weight x subject average) / sum(weights), then the same coefficient average. */
const SEC_MAX = 20;
const SEC_MENTIONS = [{ max: 6, label: 'توبيخ' }, { max: 9, label: 'مزيد من العمل' }, { max: 11, label: 'عمل مقبول' }, { max: 12, label: 'لوحة شرف' }, { max: 14, label: 'تشجيع' }, { max: 15, label: 'تشجيع' }, { max: 20, label: 'تهنئة' }];
const isSec = cl => (cl || C()).system === 'secondary';
const num = v => typeof v === 'number';
const secAvg = m => m ? ((num(m.e) ? m.e : 0) * 2 + (num(m.t) ? m.t : 0)) / 3 : 0;
const secHas = m => !!m && (num(m.t) || num(m.e));
const coefSum = cl => (cl || C()).subjects.reduce((a, s) => a + (+s.coef || 0), 0);
function mentionFor(avg, cl) {
  if (avg == null || isNaN(avg)) return '';
  const list = ((cl || C()).mentions && (cl || C()).mentions.length ? (cl || C()).mentions : SEC_MENTIONS).slice().sort((a, b) => a.max - b.max);
  for (const m of list) if (avg < +m.max) return m.label;
  return list.length && avg <= +list[list.length - 1].max ? list[list.length - 1].label : '';
}
function computeSec(cl) {
  const subs = cl.subjects, CS = coefSum(cl);
  const R = { exams: {}, general: { n: 0 }, byPupil: new Map(), sec: true };
  for (const p of cl.pupils) R.byPupil.set(p.id, { ex: {}, gen: null });
  for (const ex of S.exams) {
    const vals = [];
    for (const p of cl.pupils) {
      const mk = (p.marks && p.marks[ex.id]) || {};
      let total = 0, n = 0; const subj = {};
      for (const s of subs) {
        const m = mk[s.id];
        if (secHas(m)) { n++; subj[s.id] = secAvg(m); }
        if (+s.coef) total += (+s.coef) * secAvg(m);
      }
      const complete = subs.every(s => !(+s.coef) || (mk[s.id] && num(mk[s.id].t) && num(mk[s.id].e)));
      const r = total ? { total, avg: CS ? total / CS : null, n, complete, subj, rank: null } : null;
      R.byPupil.get(p.id).ex[ex.id] = r;
      if (r && r.avg != null) vals.push([p.id, r.avg]);
    }
    for (const [id, rk] of rankOf(vals)) R.byPupil.get(id).ex[ex.id].rank = rk;
    R.exams[ex.id] = summarize(vals.map(v => v[1]));
  }
  const W = S.exams.reduce((a, e) => a + (+e.weight || 0), 0), gv = [];
  for (const p of cl.pupils) {
    const pr = R.byPupil.get(p.id);
    if (!W || !S.exams.some(e => pr.ex[e.id])) continue;
    let total = 0; const subj = {};
    for (const s of subs) {
      let acc = 0;
      for (let k = S.exams.length - 1; k >= 0; k--) acc += secAvg(((p.marks && p.marks[S.exams[k].id]) || {})[s.id]) * (+S.exams[k].weight || 0);
      subj[s.id] = acc / W;
      if (+s.coef) total += (+s.coef) * subj[s.id];
    }
    if (total) { pr.gen = { total, avg: CS ? total / CS : null, subj, rank: null }; gv.push([p.id, pr.gen.avg]); }
  }
  for (const [id, rk] of rankOf(gv)) R.byPupil.get(id).gen.rank = rk;

}

  for (const p of cl.pupils) R.byPupil.set(p.id, { ex: {}, gen: null });
  for (const ex of S.exams) {
    const vals = [];
    for (const p of cl.pupils) {
      const m = (p.marks && p.marks[ex.id]) || {};
      let n = 0, sum = 0;
      for (const s of cl.subjects) { const v = m[s.id]; if (typeof v === 'number') { n++; sum += v; } }
      const r = n ? { total: sum, avg: MT ? sum * scale / MT : null, n, complete: n === cl.subjects.length, rank: null } : null;
      R.byPupil.get(p.id).ex[ex.id] = r;
      if (r && r.avg != null) vals.push([p.id, r.avg]);
    }
    for (const [id, rk] of rankOf(vals)) R.byPupil.get(id).ex[ex.id].rank = rk;
    R.exams[ex.id] = summarize(vals.map(v => v[1]));
  }
  const W = S.exams.reduce((a, e) => a + (+e.weight || 0), 0);
  const gv = [];
  for (const p of cl.pupils) {
    const pr = R.byPupil.get(p.id);
    if (W > 0 && MT && S.exams.every(e => pr.ex[e.id])) {
      const t = S.exams.reduce((a, e) => a + pr.ex[e.id].total * (+e.weight || 0), 0) / W;
      pr.gen = { total: t, avg: t * scale / MT, rank: null };
      gv.push([p.id, pr.gen.avg]);
    }
  }
  for (const [id, rk] of rankOf(gv)) R.byPupil.get(id).gen.rank = rk;
  R.general = summarize(gv.map(v => v[1]));
  return R;
}

  const res = fin ? pr.gen : pr.ex[ex.id];
  const mk = k => (p.marks && p.marks[S.exams[k].id]) || {};
  const rows = cl.subjects.map(s => {
    const cur = mk(idx)[s.id], sa = res && res.subj ? res.subj[s.id] : null, coef = +s.coef || 0;

  }).join('');
  const foot = (ar, fr, val, cls) => '<tr class="' + (cls || 'sum') + '"><th scope="row" colspan="' + (2 + S.exams.length) + '">' + ar + ' <span class="fr in" dir="ltr">' + fr + '</span></th><td colspan="3" class="g">' + val + '</td><td></td></tr>';

    foot('التقدير', 'Mention', res ? '<b>' + esc(mentionFor(res.avg, cl)) + '</b>' : '—');

    '<div class="fr" dir="ltr">' + lines([sc.republicFr, sc.mottoFr, sc.ministryFr, sc.nameFr, sc.phone ? 'Tél : ' + sc.phone : '']) + '</div></div>' +

    '<span>الرقم الوطني: <b dir="ltr">' + esc(p.nat || '') + '</b> <i dir="ltr">N° national</i></span>' +

    '<span>السنة الدراسية: <b dir="ltr">' + esc(classYear(cl)) + '</b> <i dir="ltr">Année scolaire</i></span>' +
    '<span><b>' + esc(ex.title) + '</b> <i dir="ltr">Examen ' + (ROMAN[idx] || idx + 1) + '</i></span></div>' +
    '<table class="sec"><thead><tr><th>المواد<span class="fr" dir="ltr">Matières</span></th><th>معدل الاختبارات<span class="fr" dir="ltr">Moy. interrog.</span></th>' +

    if (this.error) return { text: this.error + L(' — اضغط لإعادة المحاولة'), cls: 'err act' };

    const r = await window.fetch(url, { method, headers: h, body });
    if (r.status === 401) { this.meta.token = null; this.saveMeta(); throw new Error('auth'); }

  async json(method, url, body, type) { const r = await this.fetch(method, url, body, type); return r ? r.json() : null; },
  async findFolder() {
    const q = encodeURIComponent("name='" + this.FOLDER + "' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    const r = await this.json('GET', 'https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files(id)&q=' + q);
    if (r && r.files.length) return r.files[0].id;
    const c = await this.json('POST', 'https://www.googleapis.com/drive/v3/files?fields=id', JSON.stringify({ name: this.FOLDER, mimeType: 'application/vnd.google-apps.folder' }), 'application/json');

  },
  async findFile() {

      const f = await this.json('GET', 'https://www.googleapis.com/drive/v3/files/' + this.meta.fileId + '?fields=id,modifiedTime,trashed');
      if (f && !f.trashed) return f;
    }
    const q = encodeURIComponent("name='" + this.FILE + "' and trashed=false");
    const r = await this.json('GET', 'https://www.googleapis.com/drive/v3/files?spaces=drive&orderBy=modifiedTime desc&fields=files(id,modifiedTime)&q=' + q);

  async create(snapshot) {

    if (!this.hasToken()) {
      if (!manual) { this.status(); return; }
      try { await this.getToken(); }
      catch (e) {
        toast(e.message.startsWith('other:') ? L('حساب Google المختار (') + e.message.slice(6) + L(') ليس حساب Drive المربوط (') + this.meta.drive + L('). لتغييره: الإعدادات ← «تغيير حساب Google Drive».') : L('لم يكتمل تسجيل الدخول بحساب Google'));

        const remote = await this.download(f.id);

      }

    } catch (e) {
      this.error = e.message === 'auth' ? L('انتهت جلسة Google') : L('تعذّرت المزامنة');

  async subCheck() {
    if (!navigator.onLine) { toast(L(SUB_MSG.offline)); return; }
    await Sub.check(true);
    if (currentView() === 'settings' && !Sub.needsScreen()) render();
    if (Sub.msg) toast(subMsgText());
  },
  async subRetry() { await Sub.load(); render(); if (!Sub.needsScreen()) afterSubscribed(); },
  async subSignup() {
    const school = $('#subSchool').value.replace(/\s+/g, ' ').trim();
    if (!school) { Sub.msg = 'bad_request'; render(); return; }
    Object.assign(S.school, { name: school, nameFr: $('#subSchoolFr').value.trim(), phone: $('#subPhone').value.trim() }); touch();
    Sub.msg = '';
    const r = await Sub.signup({ school, schoolFr: S.school.nameFr, phone: S.school.phone });
    if (r !== 'ok') Sub.msg = r;
    render();
    if (!Sub.needsScreen()) afterSubscribed();
  },
  subSave() {
    Object.assign(S.school, { name: Sub.info.s, nameFr: $('#licNameFr').value.trim(), phone: $('#licPhone').value.trim(), dren: $('#licDren').value.trim(),
      inspection: $('#licInsp').value.trim(), year: $('#licYear').value.trim(), licKey: Sub.subId() });
    touch(); render(); afterSubscribed();
  }
};

/* ================= events ================= */
const view = $('#view');
view.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('.mk')) onMarkInput(t);
  else if (t.id === 'loginCode') { const v = codeDigits(t.value); if (v !== t.value) t.value = v; if (v.length === 6) actions.subVerify(); }
  else if (t.matches('.pnat')) { pupil(t.dataset.pid).nat = t.value.trim(); touch(); }
  else if (t.matches('.pname')) { pupil(t.dataset.pid).name = t.value; touch(); }
  else if (t.id === 'search') { ui.search = t.value; if (currentView() === 'list') fillList(); else { $('#tb').innerHTML = examRows(S.exams.find(x => x.id === ui.exam)); fillExam(); } }
  else if (t.dataset.bind) {
    if (t.dataset.num) { const v = parseFloat(t.value); if (isNaN(v)) return; setPath(t.dataset.bind, v); }
    else setPath(t.dataset.bind, t.value);
    touch();
    if (t.dataset.chrome || t.dataset.bind.startsWith('school.')) refreshChrome();
    if (t.dataset.total) $('#maxTotal').textContent = totalLine();
    if (/^classes\.\d+\.sectionId$/.test(t.dataset.bind)) render();
  }
});
view.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'sort') { ui.sort = t.value; saveUi(); fillList(); }
  else if (t.id === 'cardExam') { ui.cardExam = t.value; saveUi(); fillCards(); }
  else if (t.id === 'cardPupil') { ui.cardPupil = t.value; fillCards(); }
  else if (t.id === 'perPage') { ui.perPage = +t.value; saveUi(); $('#sheets').className = 'sheets per-' + ui.perPage; fillCards(); }
  else if (t.id === 'onlyMarks') { ui.onlyMarks = t.checked; saveUi(); fillCards(); }
  else if (t.id === 'ppSel') { ui.ppId = t.value; renderPP(S.exams.find(x => x.id === ui.exam)); fillExam(); }
  else if (t.id === 'jsonFile' && t.files[0]) { onImportFile(t.files[0]); t.value = ''; }
  else if (t.id === 'askAtStart') { ACC.askAtStart = t.checked; accSave(); }
});
document.addEventListener('click', e => {
  if (e.target.closest('#langBtn')) { setLang(isFr() ? 'ar' : 'fr'); return; }
  const tab = e.target.closest('#tabs [data-view]');
  if (tab) { go(tab.dataset.view); return; }
  if (e.target.closest('#acctBtn')) { accountPicker(false); return; }
  if (e.target.closest('#syncBtn')) {
    if (Sync.enabled()) { if (!Sync.busy) Sync.run(true); }
    else if (Sync.available) addGoogleAccount();
    else toast(IS_WEB ? L('المزامنة غير مفعّلة') : L('البيانات محفوظة في هذا المتصفح'));
    return;
  }
  const b = e.target.closest('#view [data-act]');
  if (b && actions[b.dataset.act]) actions[b.dataset.act](b);
});
const openClass = id => { ui.classId = id; ui.search = ''; ui.cardPupil = 'all'; ui.ppId = null; saveUi(); render(); };
$('#sectionSel').addEventListener('change', e => {
  const v = e.target.value, cur = sectionOf();
  if (v === '__add') { e.target.value = cur ? cur.id : ''; actions.addSection(); return; }
  ui.sectionId = v;
  const first = S.classes.find(c => c.sectionId === v);
  if (first) openClass(first.id);
  else { e.target.value = cur ? cur.id : ''; actions.addClass({ dataset: { sec: v } }); }
});
$('#classSel').addEventListener('change', e => {
  const v = e.target.value;
  if (v === '__add') { e.target.value = ui.classId; actions.addClass({ dataset: { sec: (sectionOf() || {}).id } }); return; }
  openClass(v);
});
view.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && (t.id === 'loginEmail' || t.id === 'loginCode')) { e.preventDefault(); actions[t.id === 'loginEmail' ? 'subSendCode' : 'subVerify'](); return; }
  if (!t.matches('.mk')) return;
  if (e.key === 'Enter') { e.preventDefault(); moveFocus(t, e.shiftKey ? -1 : 1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(t, 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveFocus(t, -1); }
});
view.addEventListener('focusin', e => { if (e.target.matches('.mk')) e.target.select(); });
let printRestore = null;
window.addEventListener('beforeprint', () => {
  setPageStyle();
  if (!printRestore && S.exams.some(e => e.id === currentView()) && entryMode() === 'pupil') {
    printRestore = { mode: ui.entryMode, search: ui.search }; ui.entryMode = 'grid'; ui.search = ''; render();
  }
});
window.addEventListener('afterprint', () => {
  if (printRestore) { ui.entryMode = printRestore.mode; ui.search = printRestore.search; printRestore = null; render(); }
});
window.addEventListener('online', () => { Sync.status(); if (Sync.enabled()) Sync.run(false); });
window.addEventListener('offline', () => Sync.status());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Sync.enabled() && Sync.hasToken()) Sync.run(false); });
window.addEventListener('storage', e => {
  if (e.key === stateKey(curId()) && e.newValue) { try { const d = JSON.parse(e.newValue); if (validState(d) && d.savedAt > S.savedAt) { S = ensureSections(d); fixClass(); render(); Sync.status(); } } catch (err) {} }
});
let resizeT = null;
window.addEventListener('resize', () => { if (ui.entryMode) return; clearTimeout(resizeT); resizeT = setTimeout(() => { if (S.exams.some(x => x.id === currentView()) && !document.activeElement.matches('.mk')) render(); }, 300); });

// On opening: ask which account to use the first time, and whenever this device has several accounts.
// A newer copy of this file can bring new classes (e.g. 2AS); offer them once to data saved earlier.
async function offerSeedClasses() {
  const seen = Array.isArray(S.seenSeed) ? S.seenSeed : [];
  const fresh = SEED.classes.filter(c => c.pupils.length && !S.classes.some(x => x.id === c.id) && !seen.includes(c.id));
  if (!fresh.length || $('#dlg').open) return;
  const ok = await ask(L('يحتوي هذا الملف على ') + (fresh.length > 1 ? L('أقسام جديدة') : L('قسم جديد')) + ': ' + fresh.map(c => c.name + ' (' + c.pupils.filter(named).length + L(' تلميذ)')).join(L('، ')) + L('. إضافته إلى بيانات «') + accLabel(curId()) + L('»؟'), L('إضافة'));
  S.seenSeed = seen.concat(fresh.map(c => c.id));
  if (ok) {
    for (const c of fresh) {
      if (!S.sections.some(s => s.id === c.sectionId)) { const sec = (SEED.sections || []).find(s => s.id === c.sectionId); if (sec) S.sections.push(clone(sec)); }
      S.classes.push(clone(c));
    }
    ensureSections(S);
    for (const k in SEED.school) if (!S.school[k]) S.school[k] = SEED.school[k];
    ui.classId = fresh[0].id; saveUi();
  }
  touch(); render();
  if (ok) toast(L('تمت إضافة ') + fresh.map(c => c.name).join(L('، ')));
}
// Once the subscription is in place: account choice, new classes from this file, Drive sync.
function afterSubscribed() {
  if (afterSubscribed.done) return;
  afterSubscribed.done = true;
  if (Sync.available && navigator.onLine) Sync.loadGis().catch(() => {});
  const localSt = readState('local');
  const optionsOnDevice = ACC.list.filter(a => Sub.off || Sub.session(a.email)).length + (Sub.off && localSt && pupilCount(localSt) > 0 ? 1 : 0);
  if ((Sub.off && !ACC.active) || (ACC.askAtStart && optionsOnDevice >= 2)) accountPicker(true);
  else { if (Sync.enabled() && Sync.hasToken() && navigator.onLine) Sync.run(false); offerSeedClasses(); }
}
(async function start() {
  loadState();
  applyLang();
  applyZoom();
  Sync.loadMeta();
  Sub.loadLogin();
  await Sub.load();
  render();
  Sync.status();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && IS_WEB && CONFIG.pwa) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (Sync.available && navigator.onLine) Sync.loadGis().catch(() => {});
  if (!Sub.needsScreen()) afterSubscribed();
  Sub.check(true);
  window.addEventListener('online', () => Sub.check(true));
  setInterval(() => Sub.check(false), 3600000);
})();
</script>
